<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า — Body Scent</title>
  <meta name="description" content="กรอกข้อมูลเพื่อสั่งซื้อสินค้า Body Scent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Sarabun:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    /* สไตล์เฉพาะหน้าสั่งซื้อ */
    .order-wrap {
      max-width: 560px;
      margin-inline: auto;
    }

    .order-card {
      padding: var(--space-4);
      background: var(--color-white);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
    }

    .order-card .btn {
      margin-top: var(--space-2);
    }

    .form-hint {
      margin: var(--space-1) 0 0;
      font-size: 0.8rem;
      color: var(--color-beige-deep);
    }

    @media (max-width: 640px) {
      .order-card { padding: var(--space-3); }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="brand">Body Scent</a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section__header">
          <span class="eyebrow">Order</span>
          <h1>สั่งซื้อสินค้า</h1>
          <hr class="divider">
          <p class="lead">กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อของคุณ</p>
        </div>

        <div class="order-wrap">
          <form id="orderForm" class="order-card">
            <div class="form-field">
              <label for="customerName">ชื่อลูกค้า</label>
              <input type="text" id="customerName" name="customerName" autocomplete="name" required>
            </div>

            <div class="form-field">
              <label for="contact">เบอร์โทร / Line</label>
              <input type="text" id="contact" name="contact" autocomplete="tel" required>
            </div>

            <div class="form-field">
              <label for="items">รายการสินค้า</label>
              <textarea id="items" name="items" rows="3" required></textarea>
            </div>

            <div class="form-field">
              <label for="total">จำนวนเงินรวม (บาท)</label>
              <input type="number" id="total" name="total" min="0" inputmode="numeric" required>
            </div>

            <div class="form-field">
              <label for="note">หมายเหตุ</label>
              <textarea id="note" name="note" rows="3"></textarea>
              <p class="form-hint">ไม่บังคับ เช่น ที่อยู่จัดส่ง หรือคำขอเพิ่มเติม</p>
            </div>

            <button type="submit" class="btn btn--solid btn--block">ยืนยันสั่งซื้อ</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a href="index.html" class="brand">Body Scent</a>
      <p>Feel Good. Smell Good. Be You.</p>
      <p>&copy; 2026 Body Scent. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
